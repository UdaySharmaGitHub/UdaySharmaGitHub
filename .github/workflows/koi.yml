
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: true

jobs:
  koi-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: asagi
          output-dir: koi

      - name: Commit light koi
        shell: bash
        run: |
          mv koi/koi.gif koi/koi-light.gif
          git add koi/koi-light.gif
          git rm --ignore-unmatch -f koi/koi.gif

          if git diff --cached --quiet; then
            echo "Light koi unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "Uday Sharma"
          git config user.email "udaysharmaprojects+git@gmail.com"

          git commit --quiet --message "koi: draw the day's koi (light)"
          git pull --rebase origin main
          git push --quiet

  koi-dark:
    runs-on: ubuntu-latest
    needs: koi-light
    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi

      - name: Commit dark koi
        shell: bash
        run: |
          mv koi/koi.gif koi/koi-dark.gif
          git add koi/koi-dark.gif

          if git diff --cached --quiet; then
            echo "Dark koi unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "Uday Sharma"
          git config user.email "udaysharmaprojects+git@gmail.com"

          git commit --quiet --message "koi: draw the day's koi (dark)"
          git pull --rebase origin main
          git push --quiet
