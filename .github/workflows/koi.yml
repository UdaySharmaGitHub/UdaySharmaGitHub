
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: true

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: yalongwastaken/git-koi@v1
        with:
          body: white
          size: 768x256
          scale: 1
          output-dir: koi

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif

          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "Uday Sharma"
          git config user.email "udaysharmaprojects+git@gmail.com"

          git commit --quiet --message "koi: draw the day's koi"
          git pull --rebase origin main
          git push --quiet
