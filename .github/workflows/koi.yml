
name: Koi

on:
  schedule:
    - cron: "20 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency:
  group: koi
  cancel-in-progress: true

jobs:
  koi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Draw asagi koi (light theme)
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: asagi
          output-dir: koi

      - name: Rename to koi-light.gif
        run: |
          mv koi/koi.gif koi/koi-light.gif
          rm -rf /home/runner/work/_temp/git-koi

      - name: Draw white koi (dark theme)
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          body: white
          output-dir: koi

      - name: Rename to koi-dark.gif
        run: mv koi/koi.gif koi/koi-dark.gif

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi-light.gif koi/koi-dark.gif

          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "Uday Sharma"
          git config user.email "udaysharmaprojects+git@gmail.com"

          git commit --quiet --message "koi: draw the day's koi"
          git pull --rebase origin main
          git push --quiet
